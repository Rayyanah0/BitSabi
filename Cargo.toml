[workspace]
resolver = "2"
members = ["crates/shared", "crates/server", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = ["BitSabi contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
bitsabi-shared = { path = "crates/shared" }
bip39 = { version = "2.2", features = ["zeroize"] }
bitcoin = "0.32"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
